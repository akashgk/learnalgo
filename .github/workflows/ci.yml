name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart run tool/embed_code.dart --check
      - run: tool/run_all.sh
      - run: dart run tool/stress_test.dart
      - run: dart run tool/stress_test_more.dart
